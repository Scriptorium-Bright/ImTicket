worker_processes 1;

events {
    worker_connections 4096;
}

http {
    limit_req_zone $uri zone=waiting_room_join:10m rate=100r/s;

    log_format waiting_room_ingress
        '$request_id $remote_addr "$request" $status '
        'request_time=$request_time upstream_time=$upstream_response_time '
        'limit_req_status=$limit_req_status';

    access_log /dev/stdout waiting_room_ingress;

    upstream imticket_app {
        server app:10080;
        keepalive 128;
    }

    upstream imticket_waiting_room {
        server waiting-room-service:10080;
        keepalive 128;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 10m;

        location ~ ^/api/reservation/waiting-room/[0-9]+/join$ {
            limit_req zone=waiting_room_join burst=2000;
            limit_req_status 429;

            proxy_pass http://imticket_waiting_room;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        location /api/reservation/waiting-room/ {
            proxy_pass http://imticket_waiting_room;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 15m;
            proxy_send_timeout 15m;
        }

        location / {
            proxy_pass http://imticket_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 15m;
            proxy_send_timeout 15m;
        }
    }
}
