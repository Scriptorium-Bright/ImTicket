spring.application.name=ticket

#SMS
coolsms.api.key=${COOLSMS_API_KEY:dummy-coolsms-key}
coolsms.api.secret=${COOLSMS_API_SECRET:dummy-coolsms-secret}
coolsms.api.from=${COOLSMS_API_FROM:01000000000}
ticket.sms.allow-test-code=${TICKET_SMS_ALLOW_TEST_CODE:false}

# NFT
infura.url=${INFURA_URL:}
ethereum.wallet.private-key=${ETHEREUM_WALLET_PRIVATE_KEY:}
solidity.contract.address=${SOLIDITY_CONTRACT_ADDRESS:}

#JPA
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:10046/capstone?useSSL=false&useUnicode=true&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:capstone}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:cider123}
# batch insert properties (jpa)
spring.jpa.properties.hibernate.jdbc.batch_size=30

# Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
# ??? ?? ????? ?? ??
spring.jpa.generate-ddl=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false
logging.level.org.hibernate.type.descriptor.sql=warn

# secret Key
spring.jwt.secret=${SPRING_JWT_SECRET:change-me-jwt-secret-change-me-jwt-secret-change-me-jwt-secret}
ticket.entry.secret=${TICKET_ENTRY_SECRET:change-me-entry-secret}

# Redis Setting
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379

#Log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [corr:%X{correlationId} run:%X{runId}] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [corr:%X{correlationId} run:%X{runId}] %logger{36} - %msg%n
logging.level.org.springframework.security=warn
logging.level.org.springframework.web.filter=warn
logging.level.org.springframework.web=warn
logging.level.org.apache.catalina=warn
logging.level.org.apache.coyote=warn
logging.level.org.example.ticket.performance.service=warn
logging.level.org.example.ticket.member.signature.service=trace

# photo
spring.servlet.multipart.enabled = true
spring.servlet.multipart.location = ${SPRING_SERVLET_MULTIPART_LOCATION:/Users/jeonjeonghyeon/bootPhoto}
spring.servlet.multipart.max-request-size = 10MB
spring.servlet.multipart.max-file-size = 1MB
ticket.upload.path = ${TICKET_UPLOAD_PATH:/Users/jeonjeonghyeon/bootPhoto/uploads}


# connection pool

spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:30}

# Reservation lock comparison (pessimistic, synchronized, reentrant, optimistic, mysql-named, single-thread)
reservation.lock-strategy=${LOCK_STRATEGY:pessimistic}
reservation.lock.named-timeout-seconds=${LOCK_NAMED_TIMEOUT_SECONDS:5}
reservation.lock.reentrant.wait-timeout-millis=${LOCK_REENTRANT_WAIT_TIMEOUT_MILLIS:1000}
reservation.lock.single-thread.queue-capacity=${LOCK_SINGLE_THREAD_QUEUE_CAPACITY:1000}
reservation.idempotency.processing-lease-seconds=${RESERVATION_IDEMPOTENCY_PROCESSING_LEASE_SECONDS:30}

# Waiting Room
reservation.waiting-room.enabled=${RESERVATION_WAITING_ROOM_ENABLED:false}
reservation.waiting-room.async-join-enabled=${RESERVATION_WAITING_ROOM_ASYNC_JOIN_ENABLED:false}
reservation.waiting-room.max-active-sessions=${RESERVATION_WAITING_ROOM_MAX_ACTIVE_SESSIONS:100}
reservation.waiting-room.admit-per-interval=${RESERVATION_WAITING_ROOM_ADMIT_PER_INTERVAL:10}
reservation.waiting-room.waiting-ticket-ttl=${RESERVATION_WAITING_ROOM_WAITING_TICKET_TTL:30m}
reservation.waiting-room.entry-lease=${RESERVATION_WAITING_ROOM_ENTRY_LEASE:5m}
reservation.waiting-room.terminal-retention=${RESERVATION_WAITING_ROOM_TERMINAL_RETENTION:1h}
reservation.waiting-room.promotion-interval=${RESERVATION_WAITING_ROOM_PROMOTION_INTERVAL:1s}
reservation.waiting-room.status-poll-after=${RESERVATION_WAITING_ROOM_STATUS_POLL_AFTER:2s}
reservation.waiting-room.join-handoff-queue-capacity=${RESERVATION_WAITING_ROOM_JOIN_HANDOFF_QUEUE_CAPACITY:50000}
reservation.waiting-room.join-handoff-poll-interval=${RESERVATION_WAITING_ROOM_JOIN_HANDOFF_POLL_INTERVAL:50ms}
reservation.waiting-room.join-handoff-retry-after=${RESERVATION_WAITING_ROOM_JOIN_HANDOFF_RETRY_AFTER:1s}
reservation.waiting-room.join-handoff-recovery-after=${RESERVATION_WAITING_ROOM_JOIN_HANDOFF_RECOVERY_AFTER:30s}
reservation.waiting-room.join-handoff-worker-queue-capacity=${RESERVATION_WAITING_ROOM_JOIN_HANDOFF_WORKER_QUEUE_CAPACITY:1000}
reservation.waiting-room.join-handoff-worker-concurrency=${RESERVATION_WAITING_ROOM_JOIN_HANDOFF_WORKER_CONCURRENCY:8}
reservation.waiting-room.lifecycle-publisher-core-pool-size=${RESERVATION_WAITING_ROOM_LIFECYCLE_PUBLISHER_CORE_POOL_SIZE:4}
reservation.waiting-room.lifecycle-publisher-max-pool-size=${RESERVATION_WAITING_ROOM_LIFECYCLE_PUBLISHER_MAX_POOL_SIZE:16}
reservation.waiting-room.lifecycle-publisher-queue-capacity=${RESERVATION_WAITING_ROOM_LIFECYCLE_PUBLISHER_QUEUE_CAPACITY:1000}
# Waiting Room 활성화 시 placeholder를 사용할 수 없으므로 운영 secret을 반드시 주입한다.
reservation.waiting-room.pass-secret=${RESERVATION_WAITING_ROOM_PASS_SECRET:change-me-waiting-room-pass-secret}

# Seat map snapshot cache. 대상 회차를 명시한 경우에만 활성화한다.
reservation.seat-map-cache.enabled=${RESERVATION_SEAT_MAP_CACHE_ENABLED:false}
reservation.seat-map-cache.enabled-performance-time-ids=${RESERVATION_SEAT_MAP_CACHE_ENABLED_PERFORMANCE_TIME_IDS:}
reservation.seat-map-cache.ttl=${RESERVATION_SEAT_MAP_CACHE_TTL:5m}


spring.jwt.expired.time = 360000000
server.port=10080
ticket.application.role=${TICKET_APPLICATION_ROLE:reservation}

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=50ms,100ms,250ms,500ms,1s,2s,5s
management.metrics.distribution.percentiles-histogram.imticket.performance.details.duration=true
management.metrics.distribution.slo.imticket.performance.details.duration=10ms,50ms,100ms,250ms,500ms,1s,2s,5s

# Required for tomcat_threads_* metrics used by the monitoring dashboard.
server.tomcat.mbeanregistry.enabled=true
