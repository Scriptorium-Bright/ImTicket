name: Experiment - Waiting Room Cache Validation

on:
  push:
    branches:
      - experiment/waiting-room-cache-validation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-tests:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20

      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: imticket_index_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -prootpass"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    env:
      WAITING_ROOM_REDIS_TEST_ENABLED: "true"
      WAITING_ROOM_REDIS_HOST: 127.0.0.1
      WAITING_ROOM_REDIS_PORT: "6379"

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Validate experiment scripts
        run: |
          bash -n scripts/test/run_waiting_room_promotion_metadata_ab.sh
          bash -n scripts/test/run_waiting_room_final_performance_closure.sh
          python3 -m py_compile scripts/test/summarize_waiting_room_promotion_ab.py

      - name: Run cache boundary and Redis concurrency tests
        run: |
          ./gradlew test \
            --tests org.example.ticket.reservation.booking.cache.SeatMapCacheReaderTest \
            --tests org.example.ticket.reservation.waitingroom.repository.redis.RedisWaitingRoomStoreIntegrationTest

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client

      - name: Run Seat index EXPLAIN experiment
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: "3306"
          MYSQL_USER: root
          MYSQL_PASSWORD: rootpass
          MYSQL_DATABASE: imticket_index_test
          SEAT_COUNT: "60000"
          PERFORMANCE_TIME_ID: "900000001"
          OUTPUT_DIR: build/db-results/seat-index-explain
        run: |
          bash scripts/test/run_seat_index_explain_experiment.sh
          cat build/db-results/seat-index-explain/RESULTS.md

      - name: Upload Seat index evidence
        uses: actions/upload-artifact@v4
        with:
          name: seat-index-explain
          path: build/db-results/seat-index-explain/
