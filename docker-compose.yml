services:
  app:
    build: .
    container_name: imticket-app
    restart: unless-stopped
    ports:
      - "10080:10080"
      - "${MANAGEMENT_BIND_ADDRESS:-127.0.0.1}:${MANAGEMENT_HOST_PORT:-10081}:10081"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL_DOCKER}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:-30}
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      SPRING_JWT_SECRET: ${SPRING_JWT_SECRET:-${JWT_SECRET:-change-me-jwt-secret-change-me-jwt-secret-change-me-jwt-secret}}

      LOCK_STRATEGY: ${LOCK_STRATEGY:-reentrant}
      LOCK_NAMED_TIMEOUT_SECONDS: ${LOCK_NAMED_TIMEOUT_SECONDS:-5}
      LOCK_REENTRANT_WAIT_TIMEOUT_MILLIS: ${LOCK_REENTRANT_WAIT_TIMEOUT_MILLIS:-1000}
      LOCK_SINGLE_THREAD_QUEUE_CAPACITY: ${LOCK_SINGLE_THREAD_QUEUE_CAPACITY:-1000}
      RESERVATION_ADMISSION_PER_SEAT_PERMITS: ${RESERVATION_ADMISSION_PER_SEAT_PERMITS:-1}
      MANAGEMENT_SERVER_PORT: ${MANAGEMENT_SERVER_PORT:-10081}
      TICKET_APPLICATION_ROLE: reservation

      RESERVATION_WAITING_ROOM_ENABLED: ${RESERVATION_WAITING_ROOM_ENABLED:-false}
      RESERVATION_WAITING_ROOM_ASYNC_JOIN_ENABLED: ${RESERVATION_WAITING_ROOM_ASYNC_JOIN_ENABLED:-false}
      RESERVATION_WAITING_ROOM_MAX_ACTIVE_SESSIONS: ${RESERVATION_WAITING_ROOM_MAX_ACTIVE_SESSIONS:-100}
      RESERVATION_WAITING_ROOM_ADMIT_PER_INTERVAL: ${RESERVATION_WAITING_ROOM_ADMIT_PER_INTERVAL:-10}
      RESERVATION_WAITING_ROOM_WAITING_TICKET_TTL: ${RESERVATION_WAITING_ROOM_WAITING_TICKET_TTL:-30m}
      RESERVATION_WAITING_ROOM_ENTRY_LEASE: ${RESERVATION_WAITING_ROOM_ENTRY_LEASE:-5m}
      RESERVATION_WAITING_ROOM_TERMINAL_RETENTION: ${RESERVATION_WAITING_ROOM_TERMINAL_RETENTION:-1h}
      RESERVATION_WAITING_ROOM_PROMOTION_INTERVAL: ${RESERVATION_WAITING_ROOM_PROMOTION_INTERVAL:-1s}
      RESERVATION_WAITING_ROOM_STATUS_POLL_AFTER: ${RESERVATION_WAITING_ROOM_STATUS_POLL_AFTER:-2s}
      RESERVATION_WAITING_ROOM_JOIN_HANDOFF_QUEUE_CAPACITY: ${RESERVATION_WAITING_ROOM_JOIN_HANDOFF_QUEUE_CAPACITY:-50000}
      RESERVATION_WAITING_ROOM_JOIN_HANDOFF_POLL_INTERVAL: ${RESERVATION_WAITING_ROOM_JOIN_HANDOFF_POLL_INTERVAL:-50ms}
      RESERVATION_WAITING_ROOM_JOIN_HANDOFF_RETRY_AFTER: ${RESERVATION_WAITING_ROOM_JOIN_HANDOFF_RETRY_AFTER:-1s}
      RESERVATION_WAITING_ROOM_JOIN_HANDOFF_RECOVERY_AFTER: ${RESERVATION_WAITING_ROOM_JOIN_HANDOFF_RECOVERY_AFTER:-30s}
      RESERVATION_WAITING_ROOM_JOIN_HANDOFF_WORKER_QUEUE_CAPACITY: ${RESERVATION_WAITING_ROOM_JOIN_HANDOFF_WORKER_QUEUE_CAPACITY:-1000}
      RESERVATION_WAITING_ROOM_JOIN_HANDOFF_WORKER_CONCURRENCY: ${RESERVATION_WAITING_ROOM_JOIN_HANDOFF_WORKER_CONCURRENCY:-8}
      RESERVATION_WAITING_ROOM_SSE_CONNECTION_TIMEOUT: ${RESERVATION_WAITING_ROOM_SSE_CONNECTION_TIMEOUT:-10m}
      RESERVATION_WAITING_ROOM_SSE_KEEPALIVE_INTERVAL: ${RESERVATION_WAITING_ROOM_SSE_KEEPALIVE_INTERVAL:-15s}
      RESERVATION_WAITING_ROOM_SSE_MAX_CONNECTIONS_PER_TICKET: ${RESERVATION_WAITING_ROOM_SSE_MAX_CONNECTIONS_PER_TICKET:-2}
      RESERVATION_WAITING_ROOM_SSE_DELIVERY_CORE_POOL_SIZE: ${RESERVATION_WAITING_ROOM_SSE_DELIVERY_CORE_POOL_SIZE:-4}
      RESERVATION_WAITING_ROOM_SSE_DELIVERY_MAX_POOL_SIZE: ${RESERVATION_WAITING_ROOM_SSE_DELIVERY_MAX_POOL_SIZE:-16}
      RESERVATION_WAITING_ROOM_SSE_DELIVERY_QUEUE_CAPACITY: ${RESERVATION_WAITING_ROOM_SSE_DELIVERY_QUEUE_CAPACITY:-1000}
      RESERVATION_WAITING_ROOM_SSE_MAX_PENDING_WRITES_PER_CONNECTION: ${RESERVATION_WAITING_ROOM_SSE_MAX_PENDING_WRITES_PER_CONNECTION:-8}
      RESERVATION_WAITING_ROOM_PASS_SECRET: ${RESERVATION_WAITING_ROOM_PASS_SECRET:-change-me-waiting-room-pass-secret}
      RESERVATION_WAITING_ROOM_ENABLED_PERFORMANCE_TIME_IDS: ${RESERVATION_WAITING_ROOM_ENABLED_PERFORMANCE_TIME_IDS:-}

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      SPRING_SERVLET_MULTIPART_LOCATION: /app/uploads
      TICKET_UPLOAD_PATH: /app/uploads
      TICKET_STARTUP_JFR_ENABLED: ${TICKET_STARTUP_JFR_ENABLED:-false}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/10080'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    networks:
      - imticket-network
    volumes:
      - ./uploads:/app/uploads

  waiting-room-service:
    build: .
    container_name: imticket-waiting-room-service
    restart: unless-stopped
    profiles:
      - waiting-room-boundary
      - waiting-room-ingress-experiment
    ports:
      - "127.0.0.1:${WAITING_ROOM_SERVICE_HOST_PORT:-10083}:10080"
      - "127.0.0.1:${WAITING_ROOM_SERVICE_MANAGEMENT_HOST_PORT:-10084}:10081"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL_DOCKER}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${WAITING_ROOM_SERVICE_HIKARI_MAXIMUM_POOL_SIZE:-4}
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      SPRING_JWT_SECRET: ${SPRING_JWT_SECRET:-${JWT_SECRET:-change-me-jwt-secret-change-me-jwt-secret-change-me-jwt-secret}}

      LOCK_STRATEGY: ${LOCK_STRATEGY:-reentrant}
      LOCK_NAMED_TIMEOUT_SECONDS: ${LOCK_NAMED_TIMEOUT_SECONDS:-5}
      LOCK_REENTRANT_WAIT_TIMEOUT_MILLIS: ${LOCK_REENTRANT_WAIT_TIMEOUT_MILLIS:-1000}
      LOCK_SINGLE_THREAD_QUEUE_CAPACITY: ${LOCK_SINGLE_THREAD_QUEUE_CAPACITY:-1000}
      RESERVATION_ADMISSION_PER_SEAT_PERMITS: ${RESERVATION_ADMISSION_PER_SEAT_PERMITS:-1}
      MANAGEMENT_SERVER_PORT: 10081
      TICKET_APPLICATION_ROLE: waiting-room

      RESERVATION_WAITING_ROOM_ENABLED: ${RESERVATION_WAITING_ROOM_ENABLED:-false}
      RESERVATION_WAITING_ROOM_ASYNC_JOIN_ENABLED: ${RESERVATION_WAITING_ROOM_ASYNC_JOIN_ENABLED:-true}
      RESERVATION_WAITING_ROOM_MAX_ACTIVE_SESSIONS: ${RESERVATION_WAITING_ROOM_MAX_ACTIVE_SESSIONS:-30}
      RESERVATION_WAITING_ROOM_ADMIT_PER_INTERVAL: ${RESERVATION_WAITING_ROOM_ADMIT_PER_INTERVAL:-25}
      RESERVATION_WAITING_ROOM_WAITING_TICKET_TTL: ${RESERVATION_WAITING_ROOM_WAITING_TICKET_TTL:-30m}
      RESERVATION_WAITING_ROOM_ENTRY_LEASE: ${RESERVATION_WAITING_ROOM_ENTRY_LEASE:-5m}
      RESERVATION_WAITING_ROOM_TERMINAL_RETENTION: ${RESERVATION_WAITING_ROOM_TERMINAL_RETENTION:-1h}
      RESERVATION_WAITING_ROOM_PROMOTION_INTERVAL: ${RESERVATION_WAITING_ROOM_PROMOTION_INTERVAL:-1s}
      RESERVATION_WAITING_ROOM_STATUS_POLL_AFTER: ${RESERVATION_WAITING_ROOM_STATUS_POLL_AFTER:-2s}
      RESERVATION_WAITING_ROOM_JOIN_HANDOFF_QUEUE_CAPACITY: ${RESERVATION_WAITING_ROOM_JOIN_HANDOFF_QUEUE_CAPACITY:-50000}
      RESERVATION_WAITING_ROOM_JOIN_HANDOFF_POLL_INTERVAL: ${RESERVATION_WAITING_ROOM_JOIN_HANDOFF_POLL_INTERVAL:-50ms}
      RESERVATION_WAITING_ROOM_JOIN_HANDOFF_RETRY_AFTER: ${RESERVATION_WAITING_ROOM_JOIN_HANDOFF_RETRY_AFTER:-1s}
      RESERVATION_WAITING_ROOM_JOIN_HANDOFF_RECOVERY_AFTER: ${RESERVATION_WAITING_ROOM_JOIN_HANDOFF_RECOVERY_AFTER:-30s}
      RESERVATION_WAITING_ROOM_JOIN_HANDOFF_WORKER_QUEUE_CAPACITY: ${RESERVATION_WAITING_ROOM_JOIN_HANDOFF_WORKER_QUEUE_CAPACITY:-1000}
      RESERVATION_WAITING_ROOM_JOIN_HANDOFF_WORKER_CONCURRENCY: ${RESERVATION_WAITING_ROOM_JOIN_HANDOFF_WORKER_CONCURRENCY:-8}
      RESERVATION_WAITING_ROOM_SSE_CONNECTION_TIMEOUT: ${RESERVATION_WAITING_ROOM_SSE_CONNECTION_TIMEOUT:-10m}
      RESERVATION_WAITING_ROOM_SSE_KEEPALIVE_INTERVAL: ${RESERVATION_WAITING_ROOM_SSE_KEEPALIVE_INTERVAL:-15s}
      RESERVATION_WAITING_ROOM_SSE_MAX_CONNECTIONS_PER_TICKET: ${RESERVATION_WAITING_ROOM_SSE_MAX_CONNECTIONS_PER_TICKET:-2}
      RESERVATION_WAITING_ROOM_SSE_DELIVERY_CORE_POOL_SIZE: ${RESERVATION_WAITING_ROOM_SSE_DELIVERY_CORE_POOL_SIZE:-4}
      RESERVATION_WAITING_ROOM_SSE_DELIVERY_MAX_POOL_SIZE: ${RESERVATION_WAITING_ROOM_SSE_DELIVERY_MAX_POOL_SIZE:-16}
      RESERVATION_WAITING_ROOM_SSE_DELIVERY_QUEUE_CAPACITY: ${RESERVATION_WAITING_ROOM_SSE_DELIVERY_QUEUE_CAPACITY:-1000}
      RESERVATION_WAITING_ROOM_SSE_MAX_PENDING_WRITES_PER_CONNECTION: ${RESERVATION_WAITING_ROOM_SSE_MAX_PENDING_WRITES_PER_CONNECTION:-8}
      RESERVATION_WAITING_ROOM_PASS_SECRET: ${RESERVATION_WAITING_ROOM_PASS_SECRET:-change-me-waiting-room-pass-secret}
      RESERVATION_WAITING_ROOM_ENABLED_PERFORMANCE_TIME_IDS: ${RESERVATION_WAITING_ROOM_ENABLED_PERFORMANCE_TIME_IDS:-}

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_SERVLET_MULTIPART_LOCATION: /app/uploads
      TICKET_UPLOAD_PATH: /app/uploads
      TICKET_STARTUP_JFR_ENABLED: ${TICKET_STARTUP_JFR_ENABLED:-false}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/10080'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    networks:
      - imticket-network
    volumes:
      - ./uploads:/app/uploads

  waiting-room-gateway:
    image: nginx:1.27-alpine
    container_name: imticket-waiting-room-gateway
    profiles:
      - waiting-room-ingress-experiment
    ports:
      - "${WAITING_ROOM_GATEWAY_HOST_PORT:-10082}:80"
    volumes:
      - ./infra/nginx/waiting-room-gateway.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy
      waiting-room-service:
        condition: service_healthy
    networks:
      - imticket-network

  redis:
    image: redis:7.4-alpine
    container_name: imticket-redis
    restart: unless-stopped
    ports:
      - "${REDIS_BIND_ADDRESS:-127.0.0.1}:${REDIS_HOST_PORT:-16380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - imticket-network

  mysql:
    image: mysql:8.0
    container_name: imticket-mysql
    restart: unless-stopped
    ports:
      - "10047:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - imticket-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.13.0
    container_name: imticket-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_BIND_ADDRESS:-127.0.0.1}:9090:9090"
    volumes:
      - ${PROMETHEUS_CONFIG_FILE:-./prometheus.yml}:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - imticket-network

  grafana:
    image: grafana/grafana:13.1.0
    container_name: imticket-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_BIND_ADDRESS:-127.0.0.1}:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - imticket-network

networks:
  imticket-network:
    driver: bridge

volumes:
  mysql-data:
  prometheus-data:
  grafana-data:
